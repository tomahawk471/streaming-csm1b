<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Companion</title>
    <style>
        :root {
            --bg: #05070d;
            --accent: #4ad9ff;
            --accent-soft: rgba(74, 217, 255, 0.55);
            --accent-think: #b98bff;
            --accent-think-soft: rgba(185, 139, 255, 0.55);
            --level: 0;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(ellipse at 50% 35%, #0d1526 0%, #05070d 60%, #030408 100%);
            color: #cfe6f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .orb-wrap {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--accent-soft);
            opacity: 0.35;
            pointer-events: none;
        }
        .ring--1 { width: 100%; height: 100%; animation: spin 18s linear infinite; }
        .ring--2 { width: 122%; height: 122%; animation: spin 26s linear infinite reverse; opacity: 0.2; }

        .orb {
            position: relative;
            width: 62%;
            height: 62%;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 30%,
                rgba(255, 255, 255, 0.95) 0%,
                var(--accent) 35%,
                rgba(10, 20, 40, 0.15) 75%);
            box-shadow:
                0 0 calc(30px + 60px * var(--level)) var(--accent-soft),
                0 0 calc(70px + 120px * var(--level)) var(--accent-soft);
            transform: scale(calc(1 + var(--level) * 0.12));
            transition: box-shadow 0.08s linear, transform 0.08s linear, background 0.6s ease;
            animation: idle-breathe 4.5s ease-in-out infinite;
        }

        .orb.thinking {
            background: radial-gradient(circle at 35% 30%,
                rgba(255, 255, 255, 0.95) 0%,
                var(--accent-think) 35%,
                rgba(20, 10, 40, 0.15) 75%);
            box-shadow:
                0 0 40px var(--accent-think-soft),
                0 0 90px var(--accent-think-soft);
            animation: think-pulse 1s ease-in-out infinite;
        }

        .orb.speaking {
            animation: none;
        }

        .orb.listening {
            animation: none;
        }

        @keyframes idle-breathe {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.15); }
        }
        @keyframes think-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status {
            font-size: 0.72rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.65;
            min-height: 1em;
            user-select: none;
        }

        .caption {
            max-width: min(560px, 86vw);
            min-height: 3.2em;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.45;
            color: #cfe6f5;
        }
        .caption .you { display: block; color: var(--muted, #6f8aa3); font-size: 0.8rem; margin-bottom: 4px; }

        .hint {
            font-size: 0.8rem;
            color: #6f8aa3;
            opacity: 0.8;
        }

        .type-row {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            width: min(420px, 86vw);
        }
        .type-row input[type="text"] {
            width: 100%;
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(74, 217, 255, 0.25);
            background: rgba(13, 21, 38, 0.6);
            color: #cfe6f5;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(6px);
        }
        .type-row input[type="text"]::placeholder {
            color: #4d6478;
        }
        .type-row input[type="text"]:focus {
            border-color: var(--accent);
        }

        /* ===== debug panel: what CSM was asked to say vs what came out ===== */
        :root {
            --panel-bg: rgba(8, 12, 22, 0.94);
            --panel-border: rgba(74, 217, 255, 0.18);
            --card-bg: rgba(20, 30, 50, 0.55);
            --muted: #6f8aa3;
            --ok: #4ade80;
            --warn: #fbbf24;
            --bad: #f87171;
        }
        .debug-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 20;
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            background: rgba(13, 21, 38, 0.7);
            color: var(--accent);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .debug-toggle[aria-pressed="true"] { background: rgba(74, 217, 255, 0.15); }

        .debug-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(480px, 100vw);
            z-index: 10;
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
        }
        .debug-panel.open { display: flex; }
        /* Wide screens: slide the orb + type box over so the panel doesn't cover them. */
        @media (min-width: 960px) {
            body.debug-open .stage { margin-right: 480px; }
            body.debug-open .type-row { left: calc((100% - 480px) / 2); }
        }
        .debug-head {
            padding: 18px 96px 10px 16px;  /* right side clears the fixed debug toggle */
            border-bottom: 1px solid var(--panel-border);
        }
        .debug-head h2 {
            margin: 0 0 4px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #cfe6f5;
        }
        .debug-head p { margin: 0; font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
        .debug-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 90px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .debug-empty { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 30px; }
        .reply-divider {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 6px;
        }
        .s-card.pending .heard-text { color: var(--muted); font-style: italic; }
        .s-card.unspoken { opacity: 0.45; }
        .s-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.82rem;
            line-height: 1.45;
        }
        .s-row { display: grid; grid-template-columns: 52px 1fr; gap: 8px; margin-bottom: 4px; }
        .s-label { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; }
        .w-missing { color: var(--bad); text-decoration: line-through; }
        .w-extra { color: var(--warn); font-style: italic; }
        .s-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--muted);
        }
        .chip {
            padding: 1px 8px;
            border-radius: 10px;
            border: 1px solid currentColor;
            font-size: 0.68rem;
        }
        .chip.ok { color: var(--ok); }
        .chip.warn { color: var(--warn); }
        .chip.bad { color: var(--bad); }
        .chip.neutral { color: var(--muted); }
        .play-btn {
            margin-left: auto;
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--accent);
            font-size: 0.7rem;
            cursor: pointer;
        }
        .pitch svg { width: 100%; height: 64px; display: block; margin-top: 6px; }
        .pitch .ref-line { stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: 1; }
        .pitch .contour { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
        .pitch text { fill: var(--muted); font-size: 8px; }
    </style>
</head>
<body>
    <div class="stage">
        <div class="orb-wrap">
            <div class="ring ring--1"></div>
            <div class="ring ring--2"></div>
            <div class="orb" id="orb"></div>
        </div>
        <div class="status" id="status">tap to listen</div>
        <div class="caption" id="caption" aria-live="polite"></div>
    </div>

    <button class="debug-toggle" id="debugToggle" aria-pressed="false" aria-controls="debugPanel">debug</button>
    <aside class="debug-panel" id="debugPanel" aria-label="Speech debug">
        <div class="debug-head">
            <h2>Asked vs. heard</h2>
            <p>Each sentence CSM speaks: the text it was given, what Whisper hears in the
            generated audio (<span class="w-missing">dropped</span> /
            <span class="w-extra">added</span> words), and its pitch curve against the
            reference voice's average (dashed line).</p>
        </div>
        <div class="debug-list" id="debugList">
            <div class="debug-empty" id="debugEmpty">Nothing spoken yet. Say something and the sentences will show up here.</div>
        </div>
    </aside>

    <div class="type-row">
        <form id="chatForm">
            <input type="text" id="messageInput" placeholder="...or type instead" autocomplete="off">
        </form>
    </div>

    <script>
        // ============================================================
        // Audio playback: Web Audio API, chunks scheduled back-to-back
        // as they arrive. All playback routes through a shared analyser
        // so the orb can react to the companion's actual voice level.
        // ============================================================
        let audioCtx = null;
        let nextStartTime = 0;
        let currentSampleRate = 24000;
        let activeSources = [];
        let playbackAnalyser = null;
        let playbackGain = null;

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                playbackGain = audioCtx.createGain();
                playbackAnalyser = audioCtx.createAnalyser();
                playbackAnalyser.fftSize = 256;
                playbackGain.connect(playbackAnalyser);
                playbackAnalyser.connect(audioCtx.destination);

                // iOS Safari suspends the AudioContext whenever the tab/app
                // loses focus (screen lock, app switch, incoming call) and
                // won't resume it on its own — without this, listening/
                // speaking can silently stop working after backgrounding.
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "visible" && audioCtx && audioCtx.state === "suspended") {
                        audioCtx.resume();
                    }
                });
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        const playbackStats = { chunks: 0, underruns: 0, gapMs: 0 };
        window.playbackStats = playbackStats;

        function playChunk(arrayBuffer) {
            const floatData = new Float32Array(arrayBuffer);
            const buffer = audioCtx.createBuffer(1, floatData.length, currentSampleRate);
            buffer.copyToChannel(floatData, 0);

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(playbackGain);
            source.onended = () => {
                activeSources = activeSources.filter((s) => s !== source);
            };

            const now = audioCtx.currentTime;
            if (nextStartTime < now) {
                // Underrun: the next piece arrived after the previous one finished
                // playing, so there's an audible gap. Counted for diagnosis.
                playbackStats.underruns += 1;
                playbackStats.gapMs += (now - nextStartTime) * 1000;
                nextStartTime = now + 0.02;
            }
            playbackStats.chunks += 1;
            source.start(nextStartTime);
            nextStartTime += buffer.duration;
            activeSources.push(source);
        }

        function stopAllPlayback() {
            activeSources.forEach((s) => {
                try { s.stop(); } catch (e) {}
            });
            activeSources = [];
            nextStartTime = audioCtx.currentTime;
        }

        // ============================================================
        // Mic capture: continuous raw PCM streamed to the server, which
        // runs VAD + faster-whisper on it. A parallel analyser drives the
        // orb's reactivity while listening.
        // ============================================================
        let micStream = null;
        let micSource = null;
        let micProcessor = null;
        let micAnalyser = null;
        let silentGain = null;
        let listening = false;

        async function startListening() {
            if (listening) return;
            ensureAudioContext();

            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
                });
            } catch (e) {
                alert("Couldn't access the microphone: " + e.message);
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "mic_start", sample_rate: audioCtx.sampleRate }));
            }

            micSource = audioCtx.createMediaStreamSource(micStream);
            micAnalyser = audioCtx.createAnalyser();
            micAnalyser.fftSize = 256;
            micSource.connect(micAnalyser);

            micProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
            micProcessor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const input = e.inputBuffer.getChannelData(0);
                const copy = new Float32Array(input); // inputBuffer's array is reused, must copy
                ws.send(copy.buffer);
            };

            // ScriptProcessorNode only fires onaudioprocess while connected
            // through to a destination in some browsers — route through a
            // silent gain node so the raw mic input is never actually
            // audible (no feedback loop).
            silentGain = audioCtx.createGain();
            silentGain.gain.value = 0;
            micSource.connect(micProcessor);
            micProcessor.connect(silentGain);
            silentGain.connect(audioCtx.destination);

            listening = true;
            setState("listening");
        }

        function stopListening() {
            if (!listening) return;
            if (micProcessor) {
                micProcessor.disconnect();
                micProcessor.onaudioprocess = null;
            }
            if (micAnalyser) micAnalyser.disconnect();
            if (silentGain) silentGain.disconnect();
            if (micSource) micSource.disconnect();
            if (micStream) micStream.getTracks().forEach((t) => t.stop());
            listening = false;
            setState("idle");
        }

        document.getElementById("orb").addEventListener("click", () => {
            if (listening) stopListening(); else startListening();
        });

        // ============================================================
        // Visual state machine: idle / listening / thinking / speaking.
        // Drives the orb's CSS class + status caption, and which
        // analyser (mic or playback) feeds its reactive glow.
        // ============================================================
        const orb = document.getElementById("orb");
        const statusEl = document.getElementById("status");
        let currentState = "idle";

        const STATUS_LABELS = {
            idle: "tap to listen",
            listening: "listening",
            thinking: "thinking",
            speaking: "speaking",
        };

        function setState(state) {
            currentState = state;
            orb.classList.remove("listening", "thinking", "speaking");
            if (state !== "idle") orb.classList.add(state);
            statusEl.textContent = STATUS_LABELS[state] || "";
        }

        function animateLevel() {
            let analyser = null;
            if (currentState === "speaking" && playbackAnalyser) {
                analyser = playbackAnalyser;
            } else if (currentState === "listening" && micAnalyser) {
                analyser = micAnalyser;
            }

            if (analyser) {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i];
                const avg = sum / data.length / 255; // 0..1
                document.documentElement.style.setProperty("--level", Math.min(1, avg * 2.2).toFixed(3));
            } else {
                document.documentElement.style.setProperty("--level", 0);
            }
            requestAnimationFrame(animateLevel);
        }
        requestAnimationFrame(animateLevel);

        // ============================================================
        // Websocket
        // ============================================================
        let ws = null;

        const WS_TOKEN = "{{ ws_token }}";

        function connectWS() {
            const proto = location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(proto + location.host + "/ws/chat?token=" + encodeURIComponent(WS_TOKEN));
            ws.binaryType = "arraybuffer";

            ws.onopen = () => {
                if (listening && audioCtx) {
                    ws.send(JSON.stringify({ type: "mic_start", sample_rate: audioCtx.sampleRate }));
                }
            };

            ws.onmessage = (event) => {
                if (typeof event.data === "string") {
                    const msg = JSON.parse(event.data);

                    if (msg.type === "reply_text") {
                        if (msg.role === "user") {
                            // voice transcript came back — she's composing a reply now
                            setState("thinking");
                            setCaption(msg.text, null);
                        } else {
                            setCaption(null, msg.text);
                        }
                    } else if (msg.type === "stream_start") {
                        // The server's own split (short sentences merged), so
                        // debug cards line up with what CSM actually generates.
                        if (msg.sentences) addPendingReply(msg.sentences);
                        stopAllPlayback();
                        currentSampleRate = msg.sample_rate;
                        nextStartTime = audioCtx.currentTime + 0.1;
                        setState("speaking");
                    } else if (msg.type === "stream_end") {
                        setState(listening ? "listening" : "idle");
                    } else if (msg.type === "interrupt") {
                        stopAllPlayback();
                        setState(listening ? "listening" : "idle");
                    } else if (msg.type === "debug_sentence") {
                        addDebugSentence(msg);
                    }
                    // no_checkin: nothing to do
                } else {
                    playChunk(event.data);
                }
            };

            ws.onclose = () => {
                setTimeout(connectWS, 1000);
            };
        }

        // ============================================================
        // Idle checkin: ask the server every POLL_INTERVAL_MS whether
        // the companion wants to bring something up on her own (see
        // IDLE_THRESHOLD_SECONDS / RESPONSE_TIMEOUT_SECONDS in config.py).
        // ============================================================
        const POLL_INTERVAL_MS = 45000;
        let idleTimer;

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ensureAudioContext();
                    ws.send(JSON.stringify({ type: "idle_checkin" }));
                }
                resetIdleTimer();
            }, POLL_INTERVAL_MS);
        }

        document.getElementById("chatForm").addEventListener("submit", (e) => {
            e.preventDefault();
            ensureAudioContext();

            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ type: "message", text: text }));
            input.value = "";
            setState("thinking");
            resetIdleTimer();
        });

        // ============================================================
        // Debug panel: asked-vs-heard word diff + pitch contour per
        // spoken sentence (see debug_analysis.py on the server).
        // ============================================================
        const debugToggle = document.getElementById("debugToggle");
        const debugPanel = document.getElementById("debugPanel");
        const debugList = document.getElementById("debugList");

        function setDebugOpen(open) {
            debugPanel.classList.toggle("open", open);
            document.body.classList.toggle("debug-open", open);
            debugToggle.setAttribute("aria-pressed", String(open));
            try { localStorage.setItem("debugOpen", open ? "1" : "0"); } catch (e) {}
        }
        debugToggle.addEventListener("click", () => setDebugOpen(!debugPanel.classList.contains("open")));
        try { if (localStorage.getItem("debugOpen") === "1") setDebugOpen(true); } catch (e) {}

        const norm = (w) => w.toLowerCase().replace(/[^a-z0-9']/g, "");

        // Word-level LCS diff: which asked-for words never came out, and
        // which heard words weren't in the text at all.
        function diffWords(asked, heard) {
            const a = asked.split(/\s+/).filter(Boolean);
            const h = heard.split(/\s+/).filter(Boolean);
            const an = a.map(norm), hn = h.map(norm);
            const dp = Array.from({ length: a.length + 1 }, () => new Array(h.length + 1).fill(0));
            for (let i = a.length - 1; i >= 0; i--)
                for (let j = h.length - 1; j >= 0; j--)
                    dp[i][j] = an[i] && an[i] === hn[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
            const aMatch = new Array(a.length).fill(false), hMatch = new Array(h.length).fill(false);
            let i = 0, j = 0;
            while (i < a.length && j < h.length) {
                if (an[i] && an[i] === hn[j]) { aMatch[i] = hMatch[j] = true; i++; j++; }
                else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
                else j++;
            }
            const scored = an.filter(Boolean).length;
            const matched = aMatch.filter((m, k) => m && an[k]).length;
            return { a, h, aMatch, hMatch, score: scored ? matched / scored : 1 };
        }

        function wordsHtml(words, matches, missClass) {
            const frag = document.createDocumentFragment();
            words.forEach((w, k) => {
                const span = document.createElement("span");
                span.textContent = w;
                if (!matches[k]) span.className = missClass;
                frag.appendChild(span);
                frag.appendChild(document.createTextNode(" "));
            });
            return frag;
        }

        // Log-scale pitch plot, 70-500Hz, with the reference median dashed.
        function pitchSvg(contour, refF0) {
            const W = 300, H = 64, lo = Math.log(70), hi = Math.log(500);
            const y = (hz) => H - 4 - ((Math.log(Math.min(500, Math.max(70, hz))) - lo) / (hi - lo)) * (H - 8);
            const x = (k) => (contour.length <= 1 ? 0 : (k / (contour.length - 1)) * W);
            let d = "", pen = false;
            contour.forEach((hz, k) => {
                if (hz == null) { pen = false; return; }
                d += (pen ? "L" : "M") + x(k).toFixed(1) + " " + y(hz).toFixed(1) + " ";
                pen = true;
            });
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
            svg.setAttribute("preserveAspectRatio", "none");
            svg.setAttribute("role", "img");
            svg.setAttribute("aria-label", "Pitch contour");
            if (refF0) {
                const line = document.createElementNS(ns, "line");
                line.setAttribute("class", "ref-line");
                line.setAttribute("x1", 0); line.setAttribute("x2", W);
                line.setAttribute("y1", y(refF0)); line.setAttribute("y2", y(refF0));
                svg.appendChild(line);
            }
            const path = document.createElementNS(ns, "path");
            path.setAttribute("class", "contour");
            path.setAttribute("d", d);
            svg.appendChild(path);
            return svg;
        }

        const STOP_CHIPS = {
            natural: ["ended naturally", "ok"],
            interrupted: ["interrupted", "neutral"],
            silence: ["stalled into silence", "bad"],
            cap: ["hit length cap", "bad"],
        };
        // ---- live caption under the orb ----
        const captionEl = document.getElementById("caption");
        let captionYou = "";
        function setCaption(you, her) {
            if (you !== null) { captionYou = you; captionEl.textContent = ""; }
            captionEl.textContent = "";
            if (captionYou) {
                const y = document.createElement("span");
                y.className = "you";
                y.textContent = "you: " + captionYou;
                captionEl.appendChild(y);
            }
            if (her) captionEl.appendChild(document.createTextNode(her));
        }

        // ---- reply blocks: cards appear as soon as the reply text exists,
        // and get filled in when each sentence's analysis arrives ----
        const replyBlocks = [];  // {replyId, cards: [el]}

        function addPendingReply(sentences) {
            // Anything still unanalysed in older replies was never spoken (interrupted).
            replyBlocks.forEach((b) => b.cards.forEach((c) => {
                if (c.classList.contains("pending") && b.replyId === null) {
                    c.classList.add("unspoken");
                    c.querySelector(".heard-text").textContent = "(not spoken)";
                }
            }));
            const empty = document.getElementById("debugEmpty");
            if (empty) empty.remove();
            const div = document.createElement("div");
            div.className = "reply-divider";
            div.textContent = "reply \u00b7 " + new Date().toLocaleTimeString();
            debugList.appendChild(div);
            const block = { replyId: null, cards: [] };
            sentences.forEach((sentence) => {
                const card = document.createElement("div");
                card.className = "s-card pending";
                const asked = document.createElement("div");
                asked.className = "s-row";
                asked.innerHTML = '<span class="s-label">asked</span>';
                const askedText = document.createElement("span");
                askedText.textContent = sentence;
                asked.appendChild(askedText);
                const heard = document.createElement("div");
                heard.className = "s-row";
                heard.innerHTML = '<span class="s-label">heard</span><span class="heard-text">analyzing\u2026</span>';
                card.append(asked, heard);
                debugList.appendChild(card);
                block.cards.push(card);
            });
            replyBlocks.push(block);
            if (replyBlocks.length > 60) replyBlocks.shift();
            debugList.scrollTop = debugList.scrollHeight;
        }

        function findCard(m) {
            let block = replyBlocks.find((b) => b.replyId === m.reply_id);
            if (!block) {
                // Bind this server reply id to the oldest reply block not yet matched
                // that isn't already marked as abandoned.
                block = replyBlocks.find((b) => b.replyId === null && b.cards.some((c) => !c.classList.contains("unspoken")));
                if (block) block.replyId = m.reply_id;
            }
            if (block && block.cards[m.index]) return block.cards[m.index];
            const card = document.createElement("div");  // fallback: page opened mid-reply
            debugList.appendChild(card);
            return card;
        }

        function chip(text, cls) {
            const c = document.createElement("span");
            c.className = "chip " + cls;
            c.textContent = text;
            return c;
        }

        function addDebugSentence(m) {
            const empty = document.getElementById("debugEmpty");
            if (empty) empty.remove();

            const diff = diffWords(m.text, m.heard || "");
            const card = findCard(m);
            card.className = "s-card";
            card.textContent = "";

            const asked = document.createElement("div");
            asked.className = "s-row";
            asked.innerHTML = '<span class="s-label">asked</span>';
            const askedText = document.createElement("span");
            askedText.appendChild(wordsHtml(diff.a, diff.aMatch, "w-missing"));
            asked.appendChild(askedText);

            const heard = document.createElement("div");
            heard.className = "s-row";
            heard.innerHTML = '<span class="s-label">heard</span>';
            const heardText = document.createElement("span");
            if (diff.h.length) heardText.appendChild(wordsHtml(diff.h, diff.hMatch, "w-extra"));
            else { heardText.textContent = "(nothing recognizable)"; heardText.className = "w-missing"; }
            heard.appendChild(heardText);

            const meta = document.createElement("div");
            meta.className = "s-meta";
            const pct = Math.round(diff.score * 100);
            meta.appendChild(chip(pct + "% words", pct >= 90 ? "ok" : pct >= 60 ? "warn" : "bad"));
            const [stopText, stopCls] = STOP_CHIPS[m.stop_reason] || [m.stop_reason || "?", "neutral"];
            meta.appendChild(chip(stopText, stopCls));
            if (m.f0_median && m.ref_f0) {
                const off = Math.round(((m.f0_median - m.ref_f0) / m.ref_f0) * 100);
                meta.appendChild(chip(Math.round(m.f0_median) + "Hz (" + (off >= 0 ? "+" : "") + off + "%)",
                    Math.abs(off) <= 15 ? "ok" : Math.abs(off) <= 35 ? "warn" : "bad"));
            }
            if (m.speed && m.speed < 0.99) {
                meta.appendChild(chip("slowed to " + m.speed.toFixed(2) + "x", "warn"));
            }
            const words = diff.a.length;
            const info = document.createElement("span");
            info.textContent = m.duration.toFixed(1) + "s" + (m.duration ? " \u00b7 " + (words / m.duration).toFixed(1) + " w/s" : "");
            meta.appendChild(info);
            if (m.audio_url) {
                const btn = document.createElement("button");
                btn.className = "play-btn";
                btn.textContent = "\u25b6 play";
                btn.addEventListener("click", () => new Audio(m.audio_url).play());
                meta.appendChild(btn);
            }

            const pitch = document.createElement("div");
            pitch.className = "pitch";
            if (m.contour && m.contour.some((v) => v != null)) pitch.appendChild(pitchSvg(m.contour, m.ref_f0));

            card.append(asked, heard, meta, pitch);
            const nearBottom = debugList.scrollHeight - debugList.scrollTop - debugList.clientHeight < 200;
            if (nearBottom) debugList.scrollTop = debugList.scrollHeight;
        }

        connectWS();
        resetIdleTimer();
    </script>
</body>
